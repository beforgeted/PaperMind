# ============================================================
# PaperMind local infrastructure
#   - MinIO         : object storage for raw PDFs
#   - Kafka (KRaft) : async task queue (no Zookeeper)
#   - Redis         : upload chunk bitmap state
#   - Elasticsearch : hybrid retrieval (BM25 + dense_vector)
# ============================================================

services:

  # ---------- MinIO ----------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: papermind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-papermind}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-papermind123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - papermind

  # Auto-create bucket on first boot
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: papermind-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-papermind} ${MINIO_SECRET_KEY:-papermind123} &&
      (mc mb -p local/${MINIO_BUCKET:-papers} || true) &&
      mc anonymous set download local/${MINIO_BUCKET:-papers} || true;
      exit 0;
      "
    networks:
      - papermind

  # ---------- Redis ----------
  redis:
    image: redis:7.2
    container_name: papermind-redis
    # 宿主机若已有 Redis（如 Windows 3.2 占 6379），改映射 6380 避免冲突
    ports:
      - "6380:6379"
    volumes:
      - ./volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - papermind

  # ---------- Kafka (KRaft, single-node) — 官方 apache/kafka，避免 bitnami 在部分镜像源上 429 ----------
  kafka:
    image: apache/kafka:3.7.2
    hostname: broker
    container_name: papermind-kafka
    # Docker Desktop 单独点「启动」时，容器内往往解析不了 hostname `broker`，
    # 会导致 KRaft 启动报 UnknownHostException: broker。映射到本机环回即可。
    extra_hosts:
      - "broker:127.0.0.1"
    ports:
      - "9092:9092"   # PLAINTEXT_HOST：本机 Windows / 宿主机上的 API、Worker 用 localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - ./volumes/kafka:/tmp/kraft-combined-logs
    networks:
      - papermind

  # ---------- Elasticsearch (single-node, vector enabled) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: papermind-elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      xpack.security.enabled: "false"
      # dense_vector + kNN are GA in 8.x; nothing extra needed here.
    ports:
      - "9201:9200"   # 宿主机 9201→容器内 9200（避免与本机已在用的 9200 冲突）
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./volumes/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - papermind

networks:
  papermind:
    driver: bridge
